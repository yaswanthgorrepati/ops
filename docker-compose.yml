version: '3.9'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql-ops
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ops_db
      MYSQL_USER: ops_user
      MYSQL_PASSWORD: ops_pass
    volumes:
      - mysql_data:/var/lib/mysql
#    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  ops-app:
    build: .
    container_name: order-processing-system
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - env/app.env
    ports:
      - "8080:8080"
    volumes:
      - ./logs:/app/logs
volumes:
  mysql_data:
